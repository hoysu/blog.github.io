<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 2em;
        }
        h1 {
            color: #333;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            margin: 1em 0;
        }
        a {
            text-decoration: none;
            color: #0066cc;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Markdown Viewer</h1>
    <p>아래 목차를 클릭하여 내용을 확인하세요:</p>
    <ul>
        <li><a href="blog1.html">Page 1: Introduction</a></li>
        # <li><a href="page2.md">Page 2: Details</a></li>
    </ul>
</body>
</html>
